<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEET Compass</title>
  <meta name="description" content="NEET Compass: NEET-UG college guidance, practice tests and study plans.">
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f6;
           font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; color: #0f172a; }
    .card { max-width: 22rem; margin: 1rem; padding: 1.75rem; border-radius: 1rem; background: #fff; text-align: center;
            box-shadow: 0 10px 30px rgba(15, 118, 110, .12); }
    .dot { width: 2.75rem; height: 2.75rem; margin: 0 auto .9rem; border-radius: .9rem; display: grid; place-items: center;
           background: linear-gradient(135deg, #14b8a6, #4f46e5); color: #fff; font-size: 1.4rem; font-weight: 800; }
    h1 { margin: 0 0 .3rem; font-size: 1.25rem; }
    p { margin: .3rem 0; color: #475569; font-size: .95rem; }
    a { color: #0f766e; font-weight: 600; }
  </style>
</head>
<body>
  <main class="card">
    <div class="dot">+</div>
    <h1>Opening NEET Compass…</h1>
    <p id="msg">Taking you to the site.</p>
    <p><a id="go" href="#" hidden>Open NEET Compass</a></p>
  </main>
  <script>
    // The site runs on a Cloudflare address that changes when it restarts; current.json always has the latest one.
    fetch("current.json?t=" + Date.now(), { cache: "no-store" })
      .then((r) => r.json())
      .then((d) => {
        const url = new URL(d.url);
        if (!/\.(trycloudflare\.com|ts\.net)$/.test(url.hostname)) throw new Error("unexpected address");
        const target = url.origin + location.hash.replace(/^#/, "");  // e.g. .../NEET/#/colleges opens /colleges
        const go = document.getElementById("go");
        go.href = target; go.hidden = false;
        location.replace(target);
      })
      .catch(() => {
        document.getElementById("msg").textContent = "The site is offline right now. Please try again in a few minutes.";
      });
  </script>
</body>
</html>
