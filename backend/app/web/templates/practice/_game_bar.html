{# Daily-quiz game status. Expects a (attempt), g (game.run), HEARTS; `now` = position being played (optional). #}
<div id="gamebar" class="card" {{ 'hx-swap-oob=true' if oob }}>
  <div class="flex flex-wrap items-center gap-3">
    <div class="flex gap-1" role="img" aria-label="{{ g.hearts }} of {{ HEARTS }} lives left">
      {% for i in range(HEARTS) %}<span class="heart {{ 'lost' if i >= g.hearts }}" aria-hidden="true">♥</span>{% endfor %}
    </div>
    {% if g.combo >= 2 %}<span class="combo">combo ×{{ g.combo }}</span>{% endif %}
    <span class="xp-pill ml-auto">⚡ {{ g.xp }} XP</span>
  </div>
  <div class="mt-3 flex gap-1.5" aria-label="Progress: {{ g.answered }} of {{ g.total }} answered">
    {% for i in a.items|sort(attribute='position') %}
      <span class="gdot {{ 'now' if now == i.position else ('right' if i.selected_index is not none and i.selected_index == i.correct_index else 'wrong' if i.selected_index is not none else '') }}"></span>
    {% endfor %}
  </div>
</div>
