# Optional local services for development (the app defaults to SQLite and in-process rate limits).
#   docker compose up -d
# then in backend/.env:
#   DATABASE_URL=postgresql+psycopg://neet:neet@localhost:5432/neet
#   REDIS_URL=redis://localhost:6379/0
# and run `alembic upgrade head`.
services:
  db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: neet
      POSTGRES_PASSWORD: neet
      POSTGRES_DB: neet
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
